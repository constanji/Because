#不要直接编辑这个文件。可以编辑 'docker-compose.override.yaml' 文件。
#参考 `docker-compose.override.yaml.example' 文件获取一些示例配置。
name: because
services:
  api:
    container_name: Because
    ports:
      - "${API_PORT:-80}:3080"
    # depends_on:
    #   - rag_api
    image: localhost:5000/because:latest
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - DOMAIN_CLIENT=http://localhost:${API_PORT:-50880}
      - DOMAIN_SERVER=http://localhost:${API_PORT:-50880}
      - MONGO_URI=mongodb://host.docker.internal:${MONGO_PORT:-52833}/BecauseAi
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-54900}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-54900}
      - BECAUSE_LOG_DIR=/app/api/logs
      - CONFIG_PATH=/app/Because.yaml
      - VITE_DAT_OPENAPI_BASE_URL=http://localhost:8080
      - VITE_DAT_OPENAPI_BASE_URL=http://host.docker.internal:8080

    volumes:
      - type: bind
        source: /opt/cicd/because/.env
        target: /app/.env
      - /opt/cicd/because/specs:/app/specs
      - /opt/cicd/because/images:/app/client/public/images
      - /opt/cicd/because/uploads:/app/uploads
      - /opt/cicd/because/logs:/app/api/logs
      - /opt/cicd/because/logs:/app/logs
      - /opt/cicd/because/Because.yaml:/app/Because.yaml
      # 挂载本地静态资源
      #- ./client/dist:/app/client/dist
      #- ./client/public/assets:/app/client/public/assets
      #- ./client/public/fonts:/app/client/public/fonts
  mongodb:
    container_name: Because-MongoDB
    image: docker.1ms.run/library/mongo:7.0
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    ports:
    - "${MONGO_PORT:-52833}:27017" 
    volumes:
      - /opt/cicd/because/data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: Because-Meilisearch
    image: docker.1ms.run/getmeili/meilisearch:v1.12.3
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${MEILI_PORT:-53870}:7700"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - /opt/cicd/because/meili_data_v1.12:/meili_data
  vectordb:
    container_name: Because-VectorDB
    image: docker.1ms.run/pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  # rag_api:
  #   container_name: Because_Rag_api
  #   image: ghcr.io/constanji/because-rag-api-dev-lite:latest
  #   environment:
  #     - DB_HOST=vectordb
  #     - RAG_PORT=${RAG_PORT:-9000}
  #   restart: always
  #   depends_on:
  #     - vectordb
  #   env_file:
  #     - .env

volumes:
  pgdata2:
